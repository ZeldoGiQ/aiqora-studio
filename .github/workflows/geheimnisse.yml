name: Geheimnis-Prüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Keine Schlüssel im Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-banner --redact --exit-code 1
